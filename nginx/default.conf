# 1. Define the rate limit zone (10MB memory, 5 requests per second)
limit_req_zone $binary_remote_addr zone=rails_limit:10m rate=5r/s;

upstream rails_app {
    server app:3000;
}

server {
    listen 80;

    location / {
        # 2. Apply the rate limit to your Rails app
        # burst=10 allows occasional spikes; nodelay rejects excess immediately
        limit_req zone=rails_limit burst=10 nodelay;

        proxy_pass http://rails_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}