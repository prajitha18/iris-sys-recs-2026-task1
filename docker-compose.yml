

services:
  db:
    image: mysql:8
    container_name: iris-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: app_db
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - rails-network

  app:
    build: .

    depends_on:
     - db
    environment:
      DATABASE_HOST: db
      DATABASE_PASSWORD: root
    command: >
      sh -c "
      apt-get update -qq && apt-get install -y default-mysql-client &&
      until mysqladmin ping -h db -uroot -proot --silent; do
        echo 'Waiting for MySQL...';
        sleep 2;
      done;
      bundle exec rails db:create db:migrate;
      rails server -b 0.0.0.0
      "
    networks:
    - rails-network

  nginx:
    image: nginx:latest
    container_name: iris-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/.htpasswd:/etc/nginx/.htpasswd:ro
    depends_on:
      - app
    networks:
      - rails-network

volumes:
  mysql_data:

networks:
  rails-network:
    driver: bridge
