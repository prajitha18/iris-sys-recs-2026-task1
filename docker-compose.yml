version: "3.9"

services:

  nginx:
    image: nginx:latest
    container_name: iris-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/.htpasswd:/etc/nginx/.htpasswd:ro
    depends_on:
      - app
      - grafana
    networks:
      - public
      - app_net
      - monitoring_net

  app:
    build: .
    depends_on:
      - db
      - nfs
    environment:
      DATABASE_HOST: db
      DATABASE_PASSWORD: root
    command: >
      sh -c "
      until mysqladmin ping -h db --silent; do
        echo 'Waiting for MySQL...';
        sleep 2;
      done;

      bundle exec rails db:prepare;

      rails server -b 0.0.0.0 -p 3000
      "
    volumes:
      - nfs_data:/shared
    networks:
      - app_net
      - storage_net

  db:
    image: mysql:8
    container_name: iris-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: app_db
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - app_net

  nfs:
    image: itsthenetwork/nfs-server-alpine
    container_name: iris-nfs
    privileged: true
    environment:
      SHARED_DIRECTORY: /exports
    volumes:
      - nfs_data:/exports
    networks:
      - storage_net

  backup:
    image: mysql:8
    container_name: iris-backup
    depends_on:
      - db
    environment:
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - ./backups:/backup
    command: >
      sh -c "
      while true; do
        mysqldump -h db -uroot -proot app_db > /backup/backup.sql;
        echo 'Backup completed';
        sleep 60;
      done
      "
    networks:
      - app_net
      - storage_net

  prometheus:
    image: prom/prometheus
    container_name: iris-prometheus
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - monitoring_net
      - app_net

  grafana:
    image: grafana/grafana
    container_name: iris-grafana
    networks:
      - monitoring_net

volumes:
  mysql_data:
  nfs_data:

networks:
  public:
  app_net:
  storage_net:
  monitoring_net: