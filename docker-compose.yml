

services:

  nginx:
    image: nginx:latest
    container_name: iris-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/.htpasswd:/etc/nginx/.htpasswd:ro
    depends_on:
      - app
      - grafana
    networks:
      - public
      - app_net
      - monitoring_net

  app:
    build: .
    depends_on:
      - db
      - nfs
    environment:
      DATABASE_HOST: db
      DATABASE_PASSWORD: root
    command: >
      sh -c "
      until mysqladmin ping -h db --silent; do
        echo 'Waiting for MySQL...';
        sleep 2;
      done;

      bundle exec rails db:prepare;

      rails server -b 0.0.0.0 -p 3000
      "
    volumes:
      - nfs_data:/shared
    networks:
      - app_net
      - storage_net

  db:
    image: mysql:8.0
    container_name: iris-mysql
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: app_db
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - app_net

  nfs:
    image: itsthenetwork/nfs-server-alpine
    container_name: iris-nfs
    privileged: true
    environment:
      SHARED_DIRECTORY: /exports
    volumes:
      - nfs_data:/exports
    networks:
      - storage_net

  backup:
    image: alpine:3.19
    container_name: iris-backup

    environment:
      MYSQL_DATABASE: app_db
    volumes:
      - nfs_data:/data
      - ./backups:/backup
    depends_on:
      - db
      - nfs
    networks:
      - storage_net
      - app_net
    command: >
      sh -c "
      apk add --no-cache mysql-client tar;

      echo 'Waiting for MySQL...';
      until mysqladmin ping -h db -u root -proot --silent; do
        sleep 3;
      done;

      echo 'MySQL is UP';

      while true; do
        TIMESTAMP=$$(date +%F_%H-%M-%S);

        echo '=== BACKUP START ===';

        mysqldump -h db -u root -proot app_db > /backup/db_$$TIMESTAMP.sql;

        tar czf /backup/files_$$TIMESTAMP.tar.gz -C /data .;

        cd /backup && ls -tp | tail -n +6 | xargs -r rm -f --;

        echo '=== BACKUP DONE ===';

        sleep 300;
      done
      "



  prometheus:
    image: prom/prometheus
    container_name: iris-prometheus
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - monitoring_net
      - app_net

  grafana:
    image: grafana/grafana
    container_name: iris-grafana
    networks:
      - monitoring_net

  nginx-exporter:
    image: nginx/nginx-prometheus-exporter
    container_name: iris-nginx-exporter
    command:
      - -nginx.scrape-uri=http://nginx:80/nginx_status
    networks:
      - monitoring_net

  node-exporter:
    image: prom/node-exporter
    container_name: iris-node-exporter
    networks:
      monitoring_net:
        aliases:
          - node-exporter

  cadvisor:
    image: gcr.io/cadvisor/cadvisor
    container_name: iris-cadvisor
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    networks:
      - monitoring_net

volumes:
  mysql_data:
  nfs_data:

networks:
  public:
  app_net:
  storage_net:
  monitoring_net: